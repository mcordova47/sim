# Deploy config for Netlify (issue 084). The game is a static Vite bundle.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Not indexed by search engines until Marc says otherwise (index.html has the matching meta tag).
# Remove this block and the meta tag together to allow indexing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints everything in /assets/, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# These keep their names between builds, so the browser must check for a new one.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The sync function (issue 103): netlify/functions/sync.mjs answers /api/sync. It uses Netlify Blobs with
# the site's own runtime access, so there is nothing to configure here or in the Netlify settings.
[functions]
  directory = "netlify/functions"
