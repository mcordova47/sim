<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <title>Simagotchi: a studio apartment game</title>
    <meta
      name="description"
      content="A small top-down game about a studio apartment. Make coffee, do the dishes, write a song, contemplate existence. There is no goal."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Simagotchi" />
    <meta property="og:title" content="Simagotchi: a studio apartment game" />
    <meta
      property="og:description"
      content="A small top-down game about a studio apartment. Make coffee, do the dishes, write a song, contemplate existence. There is no goal."
    />
    <meta property="og:image" content="https://sim.mcord.dev/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art studio apartment with a bookshelf, a desk, a sofa and a small figure in a green sweater." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simagotchi: a studio apartment game" />
    <meta name="twitter:image" content="https://sim.mcord.dev/social.png" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @supports (height: 100dvh) {
        body { height: 100dvh; }
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* The touch layer (issue 087). Nothing here applies unless body has the class "touch",
         which the script sets on a touch screen or with ?touch=1. */
      #touch-ui {
        display: none;
        font: 700 13px/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.05em;
        color: #e8e4dc;
      }
      body.touch #touch-ui { display: block; }
      .tp-dpad, .tp-btn, .tp-pill { touch-action: none; cursor: pointer; }
      .tp-dpad { position: relative; width: 150px; height: 150px; }
      .tp-arm, .tp-hub { position: absolute; background: #4a4640; pointer-events: none; }
      .tp-up { left: 50px; top: 0; width: 50px; height: 62px; border-radius: 10px 10px 0 0; }
      .tp-down { left: 50px; top: 88px; width: 50px; height: 62px; border-radius: 0 0 10px 10px; }
      .tp-left { left: 0; top: 50px; width: 62px; height: 50px; border-radius: 10px 0 0 10px; }
      .tp-right { left: 88px; top: 50px; width: 62px; height: 50px; border-radius: 0 10px 10px 0; }
      .tp-hub { left: 50px; top: 50px; width: 50px; height: 50px; }
      .tp-dpad.tp-on-up .tp-up,
      .tp-dpad.tp-on-down .tp-down,
      .tp-dpad.tp-on-left .tp-left,
      .tp-dpad.tp-on-right .tp-right { background: #8a847a; }
      .tp-btn {
        position: absolute;
        border-radius: 50%;
        background: #6b3f3f;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px;
      }
      .tp-a { width: 72px; height: 72px; right: 0; top: 0; }
      .tp-b { width: 64px; height: 64px; right: 92px; top: 56px; }
      .tp-pill {
        min-width: 88px; height: 44px; padding: 0 8px; box-sizing: border-box;
        border-radius: 22px; background: #4a4640;
        display: flex; align-items: center; justify-content: center;
      }
      .tp-btn.tp-held, .tp-pill.tp-held { background: #8a847a; }
      /* The hidden text field (issue 093): on the page so it can take focus, but not to be seen. 16px
         keeps iOS from zooming in when it is focused. */
      .tp-text {
        position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0;
        opacity: 0; font-size: 16px; pointer-events: none; user-select: text; -webkit-user-select: text;
      }
      /* The paste box (issue 106d): the same field, shown over the picture (touch-ui sets its place). */
      .tp-text.tp-box {
        width: auto; height: auto; opacity: 1; pointer-events: auto; box-sizing: border-box; padding: 8px;
        border: 2px solid #f2c14e; border-radius: 6px; background: #1c2233; color: #f4efe6; resize: none;
        z-index: 5;
      }
      .tp-face { position: relative; width: 164px; height: 120px; }
      .tp-pills { display: flex; gap: 12px; justify-content: space-between; }

      /* Portrait: the picture on top, the controls below it. */
      @media (orientation: portrait) {
        body.touch {
          flex-direction: column;
          justify-content: flex-start;
          padding-top: max(12px, env(safe-area-inset-top));
          box-sizing: border-box;
        }
        body.touch #touch-ui {
          flex: 1;
          width: 100%;
          max-width: 430px;
          box-sizing: border-box;
          display: grid;
          grid-template-columns: auto auto;
          justify-content: space-between;
          align-content: start;
          gap: 28px 0;
          padding: 36px max(24px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        }
        body.touch .tp-pills { grid-column: 1 / 3; }
      }

      /* Landscape (issue 092): a column of controls at each side, the picture between them, nothing
         over the picture. --ls-side (the column's width) and --ls-k (a shrink factor, 1 normally)
         are set by src/render/canvas.ts from the same numbers its layout test checks. The sizes
         below are at k = 1: d-pad 120, A/B in a 132 x 104 box, pills 120 x 36. */
      @media (orientation: landscape) {
        body.touch {
          box-sizing: border-box;
          padding: env(safe-area-inset-top) calc(env(safe-area-inset-right) + var(--ls-side, 146px)) env(safe-area-inset-bottom) calc(env(safe-area-inset-left) + var(--ls-side, 146px));
        }
        body.touch #touch-ui { position: fixed; inset: 0; pointer-events: none; }
        body.touch #touch-ui > * { pointer-events: auto; position: fixed; }
        body.touch .tp-dpad {
          left: calc(env(safe-area-inset-left) + 13px * var(--ls-k, 1));
          bottom: calc(env(safe-area-inset-bottom) + 12px * var(--ls-k, 1));
          transform: scale(calc(0.8 * var(--ls-k, 1)));
          transform-origin: left bottom;
        }
        body.touch .tp-face {
          width: 132px; height: 104px;
          right: calc(env(safe-area-inset-right) + 7px * var(--ls-k, 1));
          bottom: calc(env(safe-area-inset-bottom) + 12px * var(--ls-k, 1));
          transform: scale(var(--ls-k, 1));
          transform-origin: right bottom;
        }
        body.touch .tp-a { width: 60px; height: 60px; }
        body.touch .tp-b { width: 54px; height: 54px; right: 74px; top: 48px; }
        body.touch .tp-pills {
          width: 120px;
          right: calc(env(safe-area-inset-right) + 13px * var(--ls-k, 1));
          top: calc(env(safe-area-inset-top) + 12px * var(--ls-k, 1));
          flex-direction: column; gap: 8px;
          transform: scale(var(--ls-k, 1));
          transform-origin: right top;
        }
        body.touch .tp-pill { min-width: 0; width: 120px; height: 36px; }
      }
    </style>
  </head>
  <body>
    <p style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">
      Simagotchi, a game about a studio apartment. Walk with WASD or the arrow keys, press E to use what is in front of you, Escape to stop. Progress is saved in this browser. Best on a keyboard.
    </p>
    <noscript>This game needs JavaScript.</noscript>
    <canvas id="game"></canvas>
    <div id="touch-ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
